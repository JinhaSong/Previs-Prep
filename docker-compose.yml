version: '2.3'

# USD 변환은 usd-core 가 메인 이미지에 들어있어 별도 컨테이너가 필요 없다.
#   DATA_DIR  : 작업 데이터 디렉토리 (기본 ./data)
#   HF_CACHE  : 모델 가중치 캐시 (캡션 모델 ~35GB 재다운로드 방지)

services:
  dev:
    container_name: previs-prep
    runtime: nvidia
    restart: always
    ipc: host
    shm_size: "8g"
    build:
      context: ./
      dockerfile: docker/dockerfile
    env_file:
      - docker/env.env
    ports:
      - "10000:8000"
      - "10022:22"
    stdin_open: true
    tty: true
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${HF_CACHE:-./hf-cache}:/root/.cache/huggingface
    environment:
      TZ: Asia/Seoul

